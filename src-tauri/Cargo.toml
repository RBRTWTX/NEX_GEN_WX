[package]
name = "nex-gen-wx"
version = "0.7.0"
description = "Local weather presentation authoring and rendering workstation"
authors = ["NEX GEN WX"]
edition = "2021"

[lib]
name = "nex_gen_wx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dirs = "6"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
csv = "1.3"
flate2 = "1.1"
tokio = { version = "1", features = ["time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
